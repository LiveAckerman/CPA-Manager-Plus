[project]
name = "image-service"
version = "0.1.0"
description = "In-project image generation service: ChatGPT web reverse-engineered, fronted by CPA-backed account pool."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # ---- ChatGPT reverse-engineering ----
    "curl-cffi>=0.15.0",      # chromium TLS impersonation (irreducible)
    "pillow>=12.2.0",         # image dimension detection in openai_backend_api
    "pybase64>=1.4.3",        # PoW token encoding in utils/pow.py
    "tiktoken>=0.12.0",       # text-path tokenizer (imported by conversation.py)

    # ---- FastAPI surface ----
    "fastapi>=0.136.0",
    "uvicorn>=0.44.0",
    "python-multipart>=0.0.26",   # /v1/images/edits accepts multipart form-data
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
